<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="arCUPs Food & Coffee Ordering System">

  <!-- Allow natural browser zoom on mouse scroll (Ctrl+Wheel) and touch pinch gestures -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="arCUPs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>arCUPs Coffee Shop</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Allow natural browser zoom on Ctrl + Mouse Wheel
    window.addEventListener('wheel', function(e) {
      if (e.ctrlKey) {
        e.stopImmediatePropagation();
      }
    }, { capture: true, passive: false });

    // Allow natural pinch-to-zoom with hands on touchscreens
    window.addEventListener('touchstart', function(e) {
      if (e.touches && e.touches.length > 1) {
        e.stopImmediatePropagation();
      }
    }, { capture: true, passive: false });

    window.addEventListener('touchmove', function(e) {
      if (e.touches && e.touches.length > 1) {
        e.stopImmediatePropagation();
      }
    }, { capture: true, passive: false });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
